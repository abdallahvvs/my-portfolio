<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Contact Abdallah Hillary about a project, collaboration, or opportunity." />
  <title>Contact | Abdallah Hillary</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="container nav-bar" aria-label="Main navigation">
      <a class="brand" href="index.html#home">AH / WEB</a>
      <div class="nav-links">
        <a href="index.html#home">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Skills &amp; Projects</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <section>
      <div class="container contact-layout">
        <div class="contact-details">
          <p class="eyebrow">Start a conversation</p>
          <h1>Have an idea in mind?</h1>
          <p>Send a message about a project, collaboration, or opportunity. I would be glad to hear from you.</p>
          <a class="button" href="projects.html">View skills &amp; projects</a>
        </div>
        <form id="contact-form">
          <label for="name">Your name
            <input id="name" name="name" type="text" placeholder="Enter your name" required />
          </label>
          <label for="email">Your email
            <input id="email" name="email" type="email" placeholder="you@example.com" required />
          </label>
          <label for="message">Your message
            <textarea id="message" name="message" placeholder="Tell me a little about your idea..." required></textarea>
          </label>
          <button class="button" type="submit">Send message</button>
          <p id="form-message" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">&copy; 2026 Abdallah Hillary. Built with curiosity and code.</div>
  </footer>

  <script>
    document.getElementById("contact-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("form-message").textContent = "Thank you. Your message is ready to be followed up.";
      this.reset();
    });
  </script>
</body>
</html>
